# Publicacion del frontend y proxy de FastAPI.
# ---------------------------------------------------------------------------
# HTTPS -- PENDIENTE ANTES DE PRODUCCIÓN
# ---------------------------------------------------------------------------
# Hoy todo viaja en claro por el puerto 80: el PIN que el operador tipea y el
# token de sesión que lo autoriza pasan legibles por la red. Cualquiera con un
# analizador de tráfico en esa LAN los captura, y ninguna de las otras defensas
# (Argon2, bloqueos, CSP) sirve contra eso.
#
# Para activarlo hacen falta un certificado y su clave, emitidos por TI para el
# nombre real del servidor. Con esos dos archivos montados en el contenedor:
#
#   1. Descomentar el bloque de abajo y borrar el `listen 80;` del server que
#      sigue, dejando solo la redirección.
#   2. Publicar el puerto 443 en docker-compose.yml (junto a WEB_PORT).
#   3. Poner ALLOWED_ORIGINS=https://<nombre-del-servidor> en el .env.
#
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name ctot.corpac.gob.pe;   # el nombre real del certificado
#
#     ssl_certificate     /etc/nginx/certs/ctot.crt;
#     ssl_certificate_key /etc/nginx/certs/ctot.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#
#     # Solo con HTTPS ya funcionando: le dice al navegador que no vuelva a
#     # intentar por HTTP. Activarlo antes deja el sitio inaccesible.
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     ... acá va el mismo contenido del server de abajo ...
# }

upstream ctot_backend {
    zone ctot_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ctot-api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que sirve esta app es texto (JS, CSS, JSON) y viajaba sin
    # comprimir: el paquete principal son 252 KB cuando gzip lo deja en 78, y
    # el del gráfico 362 KB contra 105. En la propia máquina no se nota, pero
    # desde otro equipo de la red es la diferencia entre abrir al instante y
    # quedarse esperando. gzip_proxied alcanza también a las respuestas JSON
    # que vienen de la API por /api/.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Sin autenticación de por medio en esta capa, evitar que la app se
    # pueda embeber en un iframe ajeno (clickjacking) y otros hardening
    # básicos de cabeceras.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # El token de sesión vive en localStorage, así que un XSS se lo llevaría.
    # script-src 'self' es la defensa real: aunque alguien logre inyectar
    # markup, el navegador no ejecuta scripts de otro origen ni en línea.
    #
    # style-src necesita 'unsafe-inline' porque React y recharts escriben
    # atributos style= en los elementos; no se puede quitar sin reescribir el
    # gráfico entero, y no es el vector que importa acá.
    #
    # connect-src 'self' cubre también el WebSocket del mismo origen (/api/ws).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Entrada única a FastAPI. La barra final de proxy_pass elimina /api antes
    # de reenviar, por ejemplo /api/flights -> http://api:8000/flights.
    # Las cabeceras Upgrade permiten usar el mismo camino para WebSocket.
    location /api/ {
        # ctot-api y no "api": ese nombre corto lo puede reclamar cualquier
        # otro proyecto conectado a esta red, y el DNS de Docker alterna entre
        # los dos. Ver el alias en docker-compose.yml.
        proxy_pass http://ctot_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        # 30 MiB de archivo admitidos por la API + envoltorio multipart.
        client_max_body_size 31m;
    }

    # index.html sin cache: si no, el navegador puede seguir sirviendo una
    # versión vieja tras un deploy y el usuario no ve los cambios ni con
    # refresco normal (solo con Ctrl+F5). Los archivos bajo /assets/ sí llevan
    # hash en el nombre (los genera Vite), así que esos pueden cachearse
    # agresivamente sin este problema.
    # `expires` en vez de `add_header Cache-Control`: en nginx, un location con
    # cualquier add_header propio DESCARTA todos los heredados del server. Con
    # el add_header de cache acá, ni la CSP ni X-Frame-Options llegaban al
    # documento principal -- justo donde importan. `expires -1` produce el
    # mismo Cache-Control: no-cache sin romper la herencia.
    location = /index.html {
        expires -1;
    }

    # Mismo motivo: acá sí hace falta add_header (por "immutable", que expires
    # no genera), así que las cabeceras de seguridad se repiten a mano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
